[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echofuse"
version = "0.1.0"
description = "Compact acoustic-scene classification with learned ensemble fusion and knowledge distillation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "torchaudio>=2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["echofuse*"]
